<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" fill="none" role="img" aria-label="TheSCI Dual-Domain Ecosystem Architecture — thesci.co and thesci.co.in">
  <defs>
