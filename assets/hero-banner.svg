  <text x="932" y="53" text-anchor="middle" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700">thesci.co</text>

  <rect x="1012" y="34" width="136" height="30" rx="15" fill="#F59E0B" fill-opacity="0.15" stroke="#FBBF24" stroke-opacity="0.55"/>
  <text x="1080" y="53" text-anchor="middle" fill="#FDE68A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700">thesci.co.in</text>

