  <rect x="608" y="192" width="258" height="80" rx="14" fill="#111C33" stroke="#818CF8" stroke-opacity="0.45" stroke-width="1.2"/>
  <text x="626" y="220" fill="#A5B4FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">03 · GITOPS PAAS</text>
  <text x="626" y="242" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="800">TheSCI Deploymate</text>
