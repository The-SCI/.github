<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D1A"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#172038"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#6366F1"/>
      <stop offset="70%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(210 60) rotate(25) scale(360 190)">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(990 250) rotate(-15) scale(380 200)">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" fill="#94A3B8" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <!-- Outer Card -->
  <rect x="0" y="0" width="1200" height="310" rx="20" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="310" rx="20" fill="url(#dots)"/>
  <rect x="0" y="0" width="1200" height="310" rx="20" fill="url(#glow1)"/>
  <rect x="0" y="0" width="1200" height="310" rx="20" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1198" height="308" rx="19" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Spectrum Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" rx="3" fill="url(#accentBar)"/>

  <!-- Top Status Pill -->
  <rect x="52" y="34" width="440" height="30" rx="15" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <circle cx="71" cy="49" r="5" fill="#10B981"/>
  <text x="86" y="53" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="0.6">
    MCA PVT LTD · EST. 2019 · RANCHI, JHARKHAND, INDIA
  </text>

